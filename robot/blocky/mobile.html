<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1320">
<title>e-puck2 · Remote</title>
<!--
  Kids' remote control for Maker Faire Rome 2026 — UNamur Robotics Lab.
  Only: robot face, proximity radar, arrows, speed slider, STOP.
  No pre-programmed demos, no LEDs/camera/raw sensor panels.
  Connect / Disconnect button; Italiano / English; light / dark theme.
  The full version of this page is kept as mobile-full.html.
-->
<style>
  :root {
    --bg: #0b1320;
    --panel: #121c2e;
    --border: #22314a;
    --text: #eaf2ff;
    --muted: #7d8ba3;
    --accent: #2ec5ff;
    --on-accent: #04121f;
    --green: #22e08a;
    --yellow: #ffd23f;
    --red: #ff4d6a;
    --track: #2a3b58;
  }
  :root[data-theme="light"] {
    --bg: #eef3f9;
    --panel: #ffffff;
    --border: #d3dde9;
    --text: #10203a;
    --muted: #5b6b82;
    --accent: #0a8fd1;
    --on-accent: #ffffff;
    --green: #0f9d63;
    --yellow: #b88a00;
    --red: #e0304f;
    --track: #c9d5e4;
  }

  /* Language + theme switches */
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .seg {
    display: flex; background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px;
  }
  .seg button, .theme-btn {
    font: inherit; font-size: 0.85rem; font-weight: 700; border: 0; cursor: pointer;
    color: var(--muted); background: transparent; border-radius: 999px; padding: 7px 14px;
  }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .theme-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .robot-name { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.01em; }
  .robot-name small { display: block; font-size: 0.7rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; }
  .conn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--muted);
    white-space: nowrap; cursor: pointer;
  }
  .conn.off  { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .conn.off .dot { background: var(--on-accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .conn.ok   { color: var(--green); border-color: rgba(34,224,138,0.4); }
  .conn.ok .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .conn.wait .dot { background: var(--yellow); animation: pulse 1s infinite; }
  .conn.bad  { color: var(--red); border-color: rgba(255,77,106,0.4); }
  .conn.bad .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* Manual IP row — only shown if the page wasn't opened from a robot */
  .ip-row { display: none; gap: 8px; }
  .ip-row.show { display: flex; }
  .ip-row input {
    flex: 1; min-width: 0; font-size: 1rem; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .ip-row button {
    padding: 10px 16px; border-radius: 10px; border: 0; font-weight: 700; font-size: 1rem;
    background: var(--accent); color: var(--on-accent);
  }

  /* Face + radar */
  .view {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .card canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; }
  .mood { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; min-height: 1.2em; }
  .card-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }

  /* Speed */
  .speed {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  .speed .icon { font-size: 1.5rem; }
  .speed input[type=range] { flex: 1; height: 36px; accent-color: var(--accent); }
  .speed .val { font-size: 1.2rem; font-weight: 800; color: var(--accent); width: 3.2em; text-align: right; }

  /* D-pad */
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 330px;
    aspect-ratio: 1 / 1;
    margin: 4px auto 0;
  }
  .btn {
    border: 0; border-radius: 22px;
    background: linear-gradient(180deg, #1f6fe0, #1452b0);
    color: #fff; font-size: 2.6rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 #0c3577, 0 8px 16px rgba(0,0,0,0.35);
    touch-action: none;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .btn.active, .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0c3577, 0 3px 8px rgba(0,0,0,0.35);
    background: linear-gradient(180deg, #2ec5ff, #1f8fe0);
  }
  .btn.stop {
    background: linear-gradient(180deg, #ff5a74, #d62e4b);
    box-shadow: 0 6px 0 #8f1a2f, 0 8px 16px rgba(0,0,0,0.35);
    font-size: 1.05rem; font-weight: 900; letter-spacing: 0.08em;
  }
  .btn.stop:active { box-shadow: 0 2px 0 #8f1a2f; }
  .btn:disabled { opacity: 0.35; }
  .notice {
    display: none; text-align: center; font-weight: 800; font-size: 1.05rem; line-height: 1.35;
    padding: 14px 16px; border-radius: 16px;
    background: var(--panel); border: 2px solid var(--yellow); color: var(--text);
  }
  .notice.show { display: block; }
  .notice.ended { border-color: var(--accent); }
  .hint { text-align: center; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="robot-name" id="robotName">e-puck2<small>UNamur Robotics Lab</small></div>
    <button class="conn off" id="conn" onclick="toggleConnect()"><span class="dot"></span><span id="connText">Connetti</span></button>
  </header>

  <div class="tools">
    <div class="seg" role="group" aria-label="Lingua / Language">
      <button id="langIt" onclick="setLang('it')">🇮🇹 Italiano</button>
      <button id="langEn" onclick="setLang('en')">🇬🇧 English</button>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <div class="ip-row" id="ipRow">
    <input id="ipInput" type="text" inputmode="decimal" placeholder="192.168.0.111">
    <button onclick="manualConnect()">OK</button>
  </div>

  <div class="view">
    <div class="card">
      <canvas id="faceCanvas" width="240" height="240"></canvas>
      <div class="mood" id="moodLabel">😴</div>
    </div>
    <div class="card">
      <canvas id="radarCanvas" width="240" height="240"></canvas>
      <div class="card-label">📡 RADAR</div>
    </div>
  </div>

  <div class="speed">
    <span class="icon">🐢</span>
    <input type="range" id="speed" min="20" max="70" step="5" value="40">
    <span class="icon">🐇</span>
    <span class="val" id="speedVal">40%</span>
  </div>

  <div class="pad">
    <div></div>
    <button class="btn" data-dir="forward" aria-label="Avanti / Forward">▲</button>
    <div></div>
    <button class="btn" data-dir="left" aria-label="Sinistra / Left">◀</button>
    <button class="btn stop" id="stopBtn" aria-label="Stop">STOP</button>
    <button class="btn" data-dir="right" aria-label="Destra / Right">▶</button>
    <div></div>
    <button class="btn" data-dir="backward" aria-label="Indietro / Back">▼</button>
    <div></div>
  </div>

  <p class="hint" id="hint">Tieni premuta una freccia per muovere il robot.</p>
</div>

<script>
// ── Robot numbers (see network/robots.md) ───────────────────────────────
const ROBOT_NUMBERS = {
  '192.168.0.111': 1,  '192.168.0.113': 2,  '192.168.0.114': 3,
  '192.168.0.115': 4,  '192.168.0.121': 5,  '192.168.0.118': 6,
  '192.168.0.112': 12, '192.168.0.116': 16, '192.168.0.124': 24,
  '192.168.0.125': 25,
};

// ── Language ────────────────────────────────────────────────────────────
const STRINGS = {
  it: {
    connect: 'Connetti', disconnect: 'Disconnetti', connecting: 'Connessione…', retry: 'Riprova',
    hint: 'Tieni premuta una freccia per muovere il robot.',
    busy: '⏳ Robot occupato — aspetta il tuo turno!',
    ended: '👋 Turno finito! Grazie per aver giocato.',
    blocked: '⏳ Aspetta un momento prima di giocare di nuovo.',
    fwd: 'Avanti', back: 'Indietro', left: 'Sinistra', right: 'Destra',
    light: 'Tema chiaro', dark: 'Tema scuro',
    moods: { happy: '😊 FELICE', worried: '😟 ATTENTO', scared: '😱 AIUTO!', curious: '🤔 CURIOSO', dizzy: '😵 GIRA LA TESTA', sleeping: '😴 DORME' },
  },
  en: {
    connect: 'Connect', disconnect: 'Disconnect', connecting: 'Connecting…', retry: 'Try again',
    hint: 'Hold an arrow to drive the robot.',
    busy: '⏳ Robot busy — wait for your turn!',
    ended: '👋 Your turn is over! Thanks for playing.',
    blocked: '⏳ Please wait a moment before playing again.',
    fwd: 'Forward', back: 'Back', left: 'Left', right: 'Right',
    light: 'Light theme', dark: 'Dark theme',
    moods: { happy: '😊 HAPPY', worried: '😟 CAREFUL', scared: '😱 HELP!', curious: '🤔 CURIOUS', dizzy: '😵 DIZZY', sleeping: '😴 SLEEPING' },
  },
};

// Remember choices on this phone (storage may be blocked — never required)
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }

let lang = load('mfr-lang') || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'it');
function t(key) { return STRINGS[lang][key]; }

function setLang(l) {
  lang = STRINGS[l] ? l : 'it';
  save('mfr-lang', lang);
  document.documentElement.lang = lang;
  document.getElementById('langIt').classList.toggle('on', lang === 'it');
  document.getElementById('langEn').classList.toggle('on', lang === 'en');
  document.getElementById('hint').textContent = t('hint');
  showNotice(noticeKey);
  const labels = { forward: 'fwd', backward: 'back', left: 'left', right: 'right' };
  document.querySelectorAll('.btn[data-dir]').forEach(b => b.setAttribute('aria-label', t(labels[b.dataset.dir])));
  setConn(document.getElementById('conn').className.replace('conn', '').trim() || 'off', connKey);
  updateThemeBtn();
}

// ── Theme ───────────────────────────────────────────────────────────────
const PALETTES = {
  dark: {
    ring: '#1b2740', ringOuter: '#2a3b58', idle: '#3d4d66', body: '#123a63', accent: '#2ec5ff',
    head: '#0d1b30', eye: '#12284a', mouth: '#2a0610', zzz: '160,160,230',
    moods: { happy: '#22e08a', worried: '#ffd23f', scared: '#ff4d6a', curious: '#2ec5ff', dizzy: '#ffd23f', sleeping: '#6b6fb3' },
  },
  light: {
    ring: '#e1e8f2', ringOuter: '#bccadc', idle: '#a6b3c5', body: '#d9eefc', accent: '#0a8fd1',
    head: '#f5f9fe', eye: '#e4eefa', mouth: '#ffdfe4', zzz: '90,90,170',
    moods: { happy: '#0f9d63', worried: '#c48f00', scared: '#e0304f', curious: '#0a8fd1', dizzy: '#c48f00', sleeping: '#6b6fb3' },
  },
};
let theme = load('mfr-theme') ||
  (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function pal() { return PALETTES[theme]; }

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = theme === 'light' ? '#eef3f9' : '#0b1320';
  updateThemeBtn();
}
function updateThemeBtn() {
  const b = document.getElementById('themeBtn');
  b.textContent = theme === 'dark' ? '☀️' : '🌙';          // shows the theme you'll switch to
  b.setAttribute('aria-label', t(theme === 'dark' ? 'light' : 'dark'));
  b.title = b.getAttribute('aria-label');
}
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  save('mfr-theme', theme);
  applyTheme();
}

// ── Connection ──────────────────────────────────────────────────────────
// When the page is opened from a robot (QR code), that robot is the target.
let robotHost = (location.protocol.startsWith('http') && location.hostname) ? location.hostname : '';
let ws = null;
let connected = false;
// Turn control: 'you' = this phone drives, 'busy' = another phone drives,
// 'blocked' = the operator ended this phone's turn. Robots with the old
// server.py don't know about turns, so this phone simply drives ('legacy').
let turn = 'none';
let legacy = false;
let claiming = false;
let noticeKey = null;

function myTurn() { return connected && (legacy || turn === 'you'); }

function showNotice(key) {
  noticeKey = key;
  const el = document.getElementById('notice');
  el.className = 'notice' + (key ? ' show' : '') + (key === 'ended' ? ' ended' : '');
  el.textContent = key ? t(key) : '';
}

function applyTurn(st) {
  const was = turn;
  turn = st;
  if (st === 'free') { claimTurn(); return; }      // robot is free → ask to drive
  if (st !== 'you' && activeDir) stopDriving();
  setPadEnabled(myTurn());
  if (st === 'you')          showNotice(null);
  else if (st === 'busy')    showNotice('busy');
  else if (st === 'blocked') showNotice(was === 'you' || noticeKey === 'ended' ? 'ended' : 'blocked');
}

// A blocked phone checks back now and then, in case its wait is over
setInterval(() => { if (connected && turn === 'blocked' && !legacy) claimTurn(); }, 15000);

function claimTurn() {
  if (!connected || claiming) return;
  claiming = true;
  fetch(base() + '/turn/claim', { method: 'POST' })
    .then(r => {
      if (r.status === 404) { legacy = true; return { turn: 'you' }; }   // old server.py
      return r.json();
    })
    .then(d => { claiming = false; if (connected) applyTurn(d.turn === 'free' ? 'busy' : d.turn); })
    .catch(() => { claiming = false; });
}

function base() { return 'http://' + robotHost + ':5000'; }

// Tap the header button to connect / disconnect
function toggleConnect() {
  if (ws) disconnect();
  else connect();
}

function setPadEnabled(on) {
  document.querySelectorAll('.pad .btn').forEach(b => { b.disabled = !on; });
}


let connKey = 'connect';
function setConn(state, key) {
  const el = document.getElementById('conn');
  el.className = 'conn ' + state;
  connKey = key;
  document.getElementById('connText').textContent = key === 'ip' ? 'IP?' : t(key);
}

function showRobotName() {
  const n = ROBOT_NUMBERS[robotHost];
  const el = document.getElementById('robotName');
  el.innerHTML = (n ? 'Robot ' + n : 'e-puck2') + '<small>UNamur Robotics Lab</small>';
}

function connect() {
  if (!robotHost) {
    document.getElementById('ipRow').classList.add('show');
    setConn('bad', 'ip');
    return;
  }
  showRobotName();
  setConn('wait', 'connecting');
  let sock;
  try { sock = new WebSocket('ws://' + robotHost + ':5000/ws'); }
  catch (e) { onDisconnected(true); return; }
  ws = sock;

  sock.onopen = () => {
    if (ws !== sock) return;
    connected = true;
    turn = 'none'; legacy = false;
    setConn('ok', 'disconnect');
    setPadEnabled(false);
    claimTurn();
  };
  sock.onmessage = (evt) => {
    let msg; try { msg = JSON.parse(evt.data); } catch (e) { return; }
    if (msg.type === 'sensors' && msg.data) onSensors(msg.data);
    if (msg.type === 'turn' && !legacy) applyTurn(msg.state);
  };
  sock.onclose = () => { if (ws === sock) onDisconnected(!connected); };
  sock.onerror = () => { try { sock.close(); } catch (e) {} };
}

// Manual disconnect: stop the robot first, then close
function disconnect() {
  stopDriving();
  if (connected && turn === 'you' && !legacy) {
    fetch(base() + '/turn/release', { method: 'POST', keepalive: true }).catch(() => {});
  }
  const sock = ws;
  ws = null;
  if (sock) { try { sock.close(); } catch (e) {} }
  onDisconnected(false);
}

// failed = true when the robot couldn't be reached at all
function onDisconnected(failed) {
  if (activeDir) stopDriving();
  ws = null;
  connected = false;
  turn = 'none';
  if (noticeKey !== 'ended') showNotice(null);   // keep "turn over" visible
  setPadEnabled(false);
  _ps = [0,0,0,0,0,0,0,0];
  face.maxPs = 0;
  if (failed) {
    setConn('bad', 'retry');            // tap to try again
  } else {
    setConn('off', 'connect');
  }
}

function manualConnect() {
  const ip = document.getElementById('ipInput').value.trim();
  if (!ip) return;
  robotHost = ip;
  document.getElementById('ipRow').classList.remove('show');
  if (ws) disconnect();
  connect();
}

// ── Sensors ─────────────────────────────────────────────────────────────
let _ps = [0,0,0,0,0,0,0,0];
const face = { tof: -1, roll: 0, pitch: 0, maxPs: 0 };

function onSensors(d) {
  if (Array.isArray(d.ps)) { _ps = d.ps; face.maxPs = Math.max(...d.ps); }
  if (typeof d.tof_mm !== 'undefined') face.tof = d.tof_mm;
  if (d.imu && d.imu.acc) {
    const a = d.imu.acc;
    face.roll  = Math.atan2(a[1], a[2]) * 180 / Math.PI;
    face.pitch = Math.atan2(-a[0], Math.sqrt(a[1]*a[1] + a[2]*a[2])) * 180 / Math.PI;
  }
}

// ── Driving ─────────────────────────────────────────────────────────────
const speedEl = document.getElementById('speed');
speedEl.addEventListener('input', () => {
  document.getElementById('speedVal').textContent = speedEl.value + '%';
  if (activeDir) drive(activeDir);           // apply new speed while held
});

let activeDir = null;
let repeatTimer = null;

function wheelsFor(dir) {
  const s = parseInt(speedEl.value, 10);
  switch (dir) {
    case 'forward':  return [ s,  s];
    case 'backward': return [-s, -s];
    case 'left':     return [-s * 0.6,  s * 0.6];   // gentler turns
    case 'right':    return [ s * 0.6, -s * 0.6];
  }
  return [0, 0];
}

function drive(dir) {
  activeDir = dir;
  document.querySelectorAll('.btn[data-dir]').forEach(b =>
    b.classList.toggle('active', b.dataset.dir === dir));
  const [l, r] = wheelsFor(dir);
  sendMotors(l, r);
  // Re-send while held so a lost request doesn't leave the robot stuck
  clearInterval(repeatTimer);
  repeatTimer = setInterval(() => {
    if (activeDir) { const [l2, r2] = wheelsFor(activeDir); sendMotors(l2, r2); }
  }, 400);
}

function stopDriving() {
  clearInterval(repeatTimer);
  repeatTimer = null;
  activeDir = null;
  document.querySelectorAll('.btn[data-dir]').forEach(b => b.classList.remove('active'));
  sendMotors(0, 0);
}

function sendMotors(left, right) {
  if (!robotHost || !myTurn()) return;
  fetch(base() + '/motors', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ left: Math.round(left), right: Math.round(right) }),
    keepalive: true,
  }).then(r => {
    if (r.status === 403) return r.json().then(d => { if (d.turn && !legacy) applyTurn(d.turn); });
  }).catch(() => {});
}

document.querySelectorAll('.btn[data-dir]').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    drive(btn.dataset.dir);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
    btn.addEventListener(ev, () => { if (activeDir === btn.dataset.dir) stopDriving(); }));
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
document.getElementById('stopBtn').addEventListener('pointerdown', e => { e.preventDefault(); stopDriving(); });

// Safety: stop whenever the page is hidden, closed or loses focus
document.addEventListener('visibilitychange', () => { if (document.hidden) stopDriving(); });
window.addEventListener('pagehide', stopDriving);
window.addEventListener('blur', stopDriving);

// ── Radar ───────────────────────────────────────────────────────────────
const PS_ANGLES = [10, 45, 90, 154, 205, 270, 315, 350];
const PS_MAX = 4000;
let sweep = 0;

function drawRadar() {
  const c = document.getElementById('radarCanvas');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height, cx = W / 2, cy = H / 2, R = W / 2 - 14;
  const P = pal(), A = P.accent;
  ctx.clearRect(0, 0, W, H);

  for (let r = 1; r <= 3; r++) {
    ctx.beginPath(); ctx.arc(cx, cy, R * r / 3, 0, Math.PI * 2);
    ctx.strokeStyle = r === 3 ? P.ringOuter : P.ring; ctx.lineWidth = r === 3 ? 2 : 1; ctx.stroke();
  }

  if (connected) {
    sweep = (sweep + 2) % 360;
    const sa = (sweep - 90) * Math.PI / 180;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, sa - 0.6, sa); ctx.closePath();
    ctx.fillStyle = A + '18'; ctx.fill();
  }

  const pts = PS_ANGLES.map((deg, i) => {
    const n = Math.min(1, (_ps[i] || 0) / PS_MAX);
    const d = R * (1 - n * 0.8);
    const a = (deg - 90) * Math.PI / 180;
    return { x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, n };
  });

  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath();
  ctx.fillStyle = A + '1c'; ctx.fill();
  ctx.strokeStyle = A + '80'; ctx.lineWidth = 2; ctx.stroke();

  pts.forEach(p => {
    const col = p.n < 0.05 ? P.idle : p.n < 0.25 ? P.moods.happy : p.n < 0.6 ? P.moods.worried : P.moods.scared;
    if (p.n > 0.05) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 10 + p.n * 10, 0, Math.PI * 2);
      ctx.fillStyle = col + '33'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, 5 + p.n * 5, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
  });

  // Robot in the middle, arrow = front
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2);
  ctx.fillStyle = P.body; ctx.fill();
  ctx.strokeStyle = A; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.lineTo(cx - 6, cy + 5); ctx.lineTo(cx + 6, cy + 5); ctx.closePath();
  ctx.fillStyle = A; ctx.fill();
}

// ── Face ────────────────────────────────────────────────────────────────
let blinkT = 0, blinking = false, animT = 0;

function moodNow() {
  const ps = face.maxPs, tof = face.tof;
  const tilt = Math.max(Math.abs(face.roll), Math.abs(face.pitch));
  if (!connected)              return 'sleeping';
  if (tof > 0 && tof < 100)    return 'scared';
  if (ps > 1500)               return 'scared';
  if (tof > 0 && tof < 250)    return 'worried';
  if (ps > 500)                return 'worried';
  if (tilt > 25)               return 'dizzy';
  if (tilt > 10)               return 'curious';
  return 'happy';
}


function drawFace() {
  const c = document.getElementById('faceCanvas');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height, cx = W / 2, cy = H / 2 + 8, R = W / 2 - 26;
  const mood = moodNow();
  const P = pal();
  const col = P.moods[mood];
  animT += 0.04;
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  const tilt = Math.max(-0.3, Math.min(0.3, face.roll * Math.PI / 180 * 0.5));
  ctx.rotate(tilt);

  // glow + head
  ctx.beginPath(); ctx.arc(0, 0, R + 8, 0, Math.PI * 2); ctx.fillStyle = col + '22'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = P.head; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();

  // antennae
  ctx.lineWidth = 2.5;
  [-1, 1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(s * R * 0.5, -R * 0.86); ctx.lineTo(s * R * 0.5, -R * 1.18); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * R * 0.5, -R * 1.18, 5, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  });

  // eyes
  blinkT++;
  if (!blinking && blinkT > 120 + Math.random() * 60) { blinking = true; blinkT = 0; }
  if (blinking && blinkT > 6) { blinking = false; blinkT = 0; }
  const closed = blinking || mood === 'sleeping';
  const eY = -R * 0.18, eX = R * 0.33, eR = R * 0.22;

  [-1, 1].forEach(s => {
    const ex = s * eX;
    if (mood === 'dizzy') {
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ex - 9, eY - 9); ctx.lineTo(ex + 9, eY + 9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + 9, eY - 9); ctx.lineTo(ex - 9, eY + 9); ctx.stroke();
      return;
    }
    if (closed) {
      ctx.beginPath(); ctx.moveTo(ex - eR, eY); ctx.lineTo(ex + eR, eY);
      ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.stroke();
      return;
    }
    const eh = mood === 'scared' ? eR * 1.2 : mood === 'worried' ? eR * 0.8 : eR * 0.95;
    ctx.beginPath(); ctx.ellipse(ex, eY, eR, eh, 0, 0, Math.PI * 2);
    ctx.fillStyle = P.eye; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    const pr = mood === 'scared' ? eR * 0.55 : eR * 0.45;
    ctx.beginPath(); ctx.arc(ex, eY, pr, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.arc(ex - pr * 0.3, eY - pr * 0.3, pr * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    if (mood === 'worried' || mood === 'scared') {
      const b = mood === 'scared' ? -eR * 0.5 : -eR * 0.3;
      ctx.beginPath(); ctx.moveTo(ex - eR * 0.8, eY - eR - 5); ctx.lineTo(ex + eR * 0.8, eY - eR - 5 + s * b);
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
    }
  });

  // mouth
  const mY = R * 0.42, mW = R * 0.5;
  ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === 'happy') {
    ctx.moveTo(-mW, mY - 4); ctx.quadraticCurveTo(0, mY + R * 0.3, mW, mY - 4); ctx.stroke();
  } else if (mood === 'worried') {
    ctx.moveTo(-mW, mY + 4); ctx.quadraticCurveTo(0, mY - R * 0.1, mW, mY + 4); ctx.stroke();
  } else if (mood === 'scared') {
    ctx.ellipse(0, mY, mW * 0.4, R * 0.15, 0, 0, Math.PI * 2);
    ctx.fillStyle = P.mouth; ctx.fill(); ctx.stroke();
  } else if (mood === 'dizzy') {
    ctx.moveTo(-mW, mY); ctx.bezierCurveTo(-mW * 0.5, mY - 10, mW * 0.5, mY + 10, mW, mY); ctx.stroke();
  } else if (mood === 'sleeping') {
    ctx.moveTo(-mW * 0.5, mY); ctx.lineTo(mW * 0.5, mY); ctx.stroke();
    const z = (animT * 20) % 30;
    ['Z', 'z', '·'].forEach((t, i) => {
      ctx.font = (18 - i * 4) + 'px sans-serif';
      ctx.fillStyle = 'rgba(' + P.zzz + ',' + (0.85 - i * 0.25) + ')';
      ctx.textAlign = 'center';
      ctx.fillText(t, R * 0.55 + i * 10, -R * 0.4 - z - i * 16);
    });
  } else {
    ctx.moveTo(-mW * 0.7, mY); ctx.quadraticCurveTo(0, mY + R * 0.12, mW * 0.7, mY); ctx.stroke();
  }
  ctx.restore();

  const lbl = document.getElementById('moodLabel');
  lbl.textContent = t('moods')[mood];
  lbl.style.color = col;
}

(function loop() { drawFace(); drawRadar(); requestAnimationFrame(loop); })();

// Start disconnected; the visitor taps "Connect"
applyTheme();
setLang(lang);
setPadEnabled(false);
showRobotName();
if (!robotHost) {
  document.getElementById('ipRow').classList.add('show');
  setConn('bad', 'ip');
}
</script>
